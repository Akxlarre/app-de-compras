name: CD - Despliegue de APK a Supabase

# Un solo disparo: al publicar la release (que crea el tag) o a mano. Con `push: tags` además,
# cada release corría dos veces en paralelo.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ── Job 1: Deploy Edge Functions ─────────────────────────────
  deploy_edge_functions:
    runs-on: ubuntu-latest
    steps:
      # Revisa TODOS los secretos antes de tocar nada: la primera release (v1.0.0) falló a mitad
      # de camino por un SUPABASE_URL inexistente.
      - name: Verificar secretos del repositorio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          faltan=""
          for s in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN GEMINI_API_KEY; do
            [ -z "${!s}" ] && faltan="$faltan $s"
          done
          if [ -n "$faltan" ]; then
            echo "❌ Faltan secretos (Settings → Secrets and variables → Actions):$faltan"
            echo "   SUPABASE_URL / SUPABASE_ANON_KEY: Supabase (producción) → Settings → API."
            echo "   SUPABASE_SERVICE_ROLE_KEY: misma página (secret key, nunca en la app)."
            exit 1
          fi
          # Freno: la v1.0.2 salió con los secretos de STAGING (el APK quedó conectado a la base de
          # staging). El ref de staging es público (.env.staging / deploy-functions-staging.yml).
          if echo "$SUPABASE_URL" | grep -q 'okcekripvbimlloqlihv'; then
            echo "❌ SUPABASE_URL apunta al proyecto de STAGING (okcekripvbimlloqlihv)."
            echo "   Usa la URL y las keys del proyecto de PRODUCCIÓN (el de app-de-entrenamiento)."
            exit 1
          fi
          case "$SUPABASE_URL" in https://*.supabase.co*) ;; *) echo "❌ SUPABASE_URL no tiene el formato https://<ref>.supabase.co"; exit 1;; esac
          case "$SUPABASE_URL" in https://*.supabase.co) ;; *) echo "⚠️ SUPABASE_URL trae algo después del dominio; se usa https://<ref>.supabase.co (conviene dejar el secreto así).";; esac
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ℹ️ Sin ANDROID_KEYSTORE_BASE64: se firma con la llave guardada en Supabase (bucket"
            echo "   privado ci-signing, fix-046); la primera vez se genera y se guarda ahí."
          fi
          echo "✅ Secretos completos."

      - name: Checkout del código
        uses: actions/checkout@v4

      # CLI desde npm: setup-cli con `latest` consulta la API de GitHub sin token y puede chocar
      # con el límite de solicitudes (pasó en el deploy de staging).
      - name: Setup Supabase CLI
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/cli" supabase@2
          echo "$RUNNER_TEMP/cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Extraer Project Ref desde SUPABASE_URL
        id: extract_ref
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          # SUPABASE_URL tiene formato https://<project-ref>.supabase.co
          REF=$(echo "$SUPABASE_URL" | sed -E 's|https://([^.]+)\.supabase\.co.*|\1|')
          echo "project_ref=$REF" >> $GITHUB_OUTPUT
          echo "📦 Project ref extraído: $REF"

      # La key de Gemini NO va en el APK: vive como secreto del proyecto Supabase y solo la
      # lee process-receipt. El proyecto es compartido con app-de-entrenamiento (usa la misma
      # key), así que publicarla desde acá es idempotente.
      - name: Publicar GEMINI_API_KEY como secreto de Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ Falta el secreto GEMINI_API_KEY en el repositorio."
            echo "   Sin él, process-receipt se despliega pero devuelve 500 al escanear boletas."
            echo "   Configúralo en Settings → Secrets and variables → Actions."
            exit 1
          fi
          supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" \
            --project-ref ${{ steps.extract_ref.outputs.project_ref }}
          echo "✅ GEMINI_API_KEY publicada en el proyecto Supabase."

      # process-receipt valida el JWT por su cuenta (y responde el preflight CORS).
      - name: Deploy Edge Function (process-receipt)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy process-receipt \
            --project-ref ${{ steps.extract_ref.outputs.project_ref }} \
            --no-verify-jwt

      # La app llama estas RPCs de `shop` (plataforma-db). Si alguna no está en la API de producción
      # (migración sin aplicar o función no expuesta), el APK saldría roto: se corta la release acá.
      # Se llaman sin sesión: una RPC existente responde 401/403 (solo `authenticated`), una que
      # falta responde 404 PGRST202 (o PGRST106 si el schema `shop` no está expuesto).
      - name: Verificar RPCs de producción
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # SUPABASE_URL puede venir con "/" final o "/rest/v1": se normaliza a https://<ref>.supabase.co.
          export SUPABASE_URL="https://$(echo "$SUPABASE_URL" | sed -E 's|https://([^.]+)\.supabase\.co.*|\1|').supabase.co"
          faltan=0
          # PostgREST busca la función por nombre Y parámetros: hay que mandar los de su firma.
          nil='00000000-0000-0000-0000-000000000000'
          while read -r fn args; do
            body=$(curl -s -o /tmp/rpc.json -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/$fn" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Profile: shop" -H "Content-Type: application/json" -d "$args")
            if [ "$body" = "404" ] || grep -qE 'PGRST202|PGRST106' /tmp/rpc.json; then
              echo "❌ $fn no está disponible en producción (HTTP $body): $(head -c 200 /tmp/rpc.json)"
              faltan=1
            else
              echo "✅ $fn (HTTP $body)"
            fi
          done <<EOF
          get_or_create_family {}
          get_family_members {}
          complete_list {"p_list_id":"$nil","p_carry_pending":false}
          preview_family {"p_code":"AAAA2222"}
          join_family_by_code {"p_code":"AAAA2222"}
          remove_family_member {"p_user_id":"$nil"}
          close_list_manual {"p_list_id":"$nil","p_carry_pending":false}
          apply_receipt {"p_list_id":"$nil","p_carry_pending":false,"p_receipt":{}}
          attach_receipt {"p_list_id":"$nil","p_receipt":{}}
          create_receipt_purchase {"p_receipt":{}}
          set_purchase_total {"p_list_id":"$nil","p_total":0}
          EOF
          if [ "$faltan" = 1 ]; then
            echo "Aplica las migraciones (plataforma-db → Deploy de migraciones, confirmar=produccion)"
            echo "y expón las funciones de 'shop' en la Data API de producción."
            exit 1
          fi

  # ── Job 2: Build y Deploy de APK ─────────────────────────────
  build_and_deploy_apk:
    runs-on: ubuntu-latest
    needs: deploy_edge_functions

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK (Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Configurar credenciales de Supabase (producción)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # SUPABASE_URL puede venir con "/" final o "/rest/v1": se normaliza a https://<ref>.supabase.co.
          export SUPABASE_URL="https://$(echo "$SUPABASE_URL" | sed -E 's|https://([^.]+)\.supabase\.co.*|\1|').supabase.co"
          node scripts/set-env.js

      - name: Build Web (Angular)
        run: npm run build:raw

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }}

      - name: Firmar APK
        id: sign_app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SIGNING_APP: shop
        run: |
          # Siempre la MISMA llave (fix-046): secret → la guardada en Supabase (ci-signing/shop) → se
          # genera una vez y se guarda. Una llave distinta hace que Android rechace la actualización.
          bash scripts/ci/ensure-keystore.sh "$RUNNER_TEMP/signing"
          set -a; . "$RUNNER_TEMP/signing/signing.env"; set +a
          cp "$RUNNER_TEMP/signing/release.keystore" release.keystore
          echo "Origen de la llave de firma: $SIGNING_SOURCE"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Usando Android Build Tools desde: $BUILD_TOOLS_DIR"
          
          APK_RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK encontrado: $APK_RAW"
          
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_RAW" android/app/build/outputs/apk/release/app-aligned.apk || cp "$APK_RAW" android/app/build/outputs/apk/release/app-aligned.apk
          
          echo "Intentando firmar APK con apksigner (detección automática)..."
          if $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out android/app/build/outputs/apk/release/app-signed.apk \
            android/app/build/outputs/apk/release/app-aligned.apk; then
            echo "✅ Firmado exitoso."
          else
            echo "Intentando firmar especificando --ks-type JKS..."
            if $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-type JKS \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out android/app/build/outputs/apk/release/app-signed.apk \
              android/app/build/outputs/apk/release/app-aligned.apk; then
              echo "✅ Firmado exitoso con JKS."
            else
              echo "Intentando firmar especificando --ks-type PKCS12..."
              $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-type PKCS12 \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" \
                --out android/app/build/outputs/apk/release/app-signed.apk \
                android/app/build/outputs/apk/release/app-aligned.apk
              echo "✅ Firmado exitoso con PKCS12."
            fi
          fi
            
          echo "signedReleaseFile=android/app/build/outputs/apk/release/app-signed.apk" >> $GITHUB_OUTPUT

      - name: Publicar Actualización en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APK_PATH: ${{steps.sign_app.outputs.signedReleaseFile}}
          VERSION_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          # SUPABASE_URL puede venir con "/" final o "/rest/v1": se normaliza a https://<ref>.supabase.co.
          export SUPABASE_URL="https://$(echo "$SUPABASE_URL" | sed -E 's|https://([^.]+)\.supabase\.co.*|\1|').supabase.co"
          node scripts/publish-update.js
