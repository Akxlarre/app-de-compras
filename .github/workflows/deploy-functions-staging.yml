name: CD - Edge Functions a staging

# Despliega process-receipt en el proyecto de STAGING (producción la despliega release.yml).
# Corre sola cuando un push cambia la función, para iterar el prompt del OCR sin tocar producción.
on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/process-receipt/**'
      - '!supabase/functions/process-receipt/eval/**'
      - '.github/workflows/deploy-functions-staging.yml'

concurrency:
  group: deploy-functions-staging
  cancel-in-progress: true

env:
  # Ref público (va en la URL de .env.staging); el token es de la misma cuenta que producción.
  STAGING_PROJECT_REF: okcekripvbimlloqlihv

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # CLI desde npm: setup-cli con `latest` consulta la API de GitHub sin token y choca con el
      # límite de solicitudes ("rate limit exceeded").
      - name: Setup Supabase CLI
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/cli" supabase@2
          echo "$RUNNER_TEMP/cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Publicar GEMINI_API_KEY como secreto de staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ Falta el secreto GEMINI_API_KEY en el repositorio."
            exit 1
          fi
          supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --project-ref "$STAGING_PROJECT_REF"

      # process-receipt valida el JWT por su cuenta (y responde el preflight CORS).
      - name: Deploy Edge Function (process-receipt)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy process-receipt \
            --project-ref "$STAGING_PROJECT_REF" \
            --no-verify-jwt
